<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfil de aprendizagem do meu filho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F0F7; --surface:#FFFFFF; --ink:#33305E; --text:#2C2B3A; --muted:#62607A;
  --line:#DAD8E8; --accent:#E3A72F; --soft:#E3E1F0;
  --cs:#2F6F8F; --as:#4B4A9A; --ar:#B5577B; --cr:#D0822A;
  --good:#2E7D5B; --mid:#A86E12; --low:#B24A62;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15141F; --surface:#1F1E2C; --ink:#CFCBF2; --text:#E6E4F0; --muted:#A3A0B8;
    --line:#302F42; --accent:#F0B845; --soft:#2A2939;
    --cs:#6FB3D4; --as:#9C9AE8; --ar:#E590B2; --cr:#F2A85A;
    --good:#6FCB9F; --mid:#F0B845; --low:#EE8BA2;
  }
}
:root[data-theme="dark"]{
  --bg:#15141F; --surface:#1F1E2C; --ink:#CFCBF2; --text:#E6E4F0; --muted:#A3A0B8;
  --line:#302F42; --accent:#F0B845; --soft:#2A2939;
  --cs:#6FB3D4; --as:#9C9AE8; --ar:#E590B2; --cr:#F2A85A;
  --good:#6FCB9F; --mid:#F0B845; --low:#EE8BA2;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 56px}
h1,h2,h3{font-family:"Young Serif",Georgia,"Times New Roman",serif;color:var(--ink);font-weight:400;line-height:1.2;margin:0}
h1{font-size:clamp(2rem,7vw,2.6rem)}
h2{font-size:1.4rem}
h3{font-size:1.12rem}
p{margin:.6em 0}
.lead{font-size:1.05rem;color:var(--muted);max-width:34em}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:13px 24px;font-weight:600;background:var(--ink);color:var(--bg);font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 14px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--surface);border-radius:20px;padding:22px;margin-top:20px;border:1px solid var(--line)}
label{display:block;font-weight:600;margin:14px 0 6px;color:var(--ink)}
input[type=text],input[type=number]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.9rem;color:var(--muted)}
.back{background:none;border:0;color:var(--ink);font-weight:600;padding:6px 0;margin-bottom:12px}
.logo{display:block;width:84px;height:84px;margin:4px 0 16px}

/* crianças e módulos */
.kid{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:10px;color:var(--text)}
.kid b{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.2rem;color:var(--ink)}
.kid .st{font-size:.85rem;color:var(--muted)}
.mod{border-left:5px solid var(--c,var(--ink))}
.mod .row{margin-top:12px}
.locked{opacity:.75}

/* questionário */
.part{font-size:.9rem;font-weight:700;color:var(--ink)}
.progress{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 8px}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
.qtext{font-family:"Young Serif",Georgia,serif;color:var(--ink);font-size:clamp(1.3rem,5vw,1.6rem);line-height:1.3;margin:10px 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--text);font-weight:500;display:flex;align-items:center;gap:12px}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed=true]{border-color:var(--ink)}
.opt[aria-pressed=true] .dot{background:var(--ink);border-color:var(--ink)}
.qnav{display:flex;justify-content:space-between;margin-top:22px}

/* resultados */
.flower,.quad{width:100%;max-width:400px;display:block;margin:10px auto 0}
.flower text,.quad text{font-family:"Figtree",sans-serif}
.flower text{font-size:12px;fill:var(--muted)}
.flower text.strong{fill:var(--ink);font-weight:700}
.trait{border-top:1px solid var(--line);padding:16px 0}
.trait:first-child{border-top:0}
.trait-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.badge{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-good{color:var(--good);border:1.5px solid var(--good)}
.b-mid{color:var(--mid);border:1.5px solid var(--mid)}
.b-low{color:var(--low);border:1.5px solid var(--low)}
.chan{margin:10px 0}
.chan .lbl{display:flex;justify-content:space-between;font-size:.95rem}
.bar{height:10px;background:var(--soft);border-radius:10px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:10px}
ul.tips{margin:8px 0 0;padding-left:1.1em}
ul.tips li{margin:6px 0}
details summary{cursor:pointer;font-weight:600;color:var(--ink);margin-top:6px}
.card{border-left:5px solid var(--c,var(--ink));padding:4px 0 4px 16px;margin:16px 0}
.card h3{color:var(--c,var(--ink))}
.card dt{font-weight:700;color:var(--ink);margin-top:10px}
.card dd{margin:2px 0 0}
.card dl{margin:10px 0 0}
.meter{display:flex;align-items:center;gap:10px;margin:10px 0}
.meter span{font-size:.9rem;width:80px;flex:none}
.meter span:last-child{text-align:right}
.meter .track{flex:1;height:10px;border-radius:10px;background:var(--soft);position:relative}
.meter .knob{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);border:3px solid var(--surface)}
.env{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:8px}
.env dt{font-weight:600;color:var(--ink)}
.env dd{margin:0}
.cross{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:14px}
.cross .tag{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cross .tag span{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.snap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.snap div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.snap small{display:block;color:var(--muted);font-size:.8rem}
.snap b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;padding:4px;font-weight:600}
.linkbtn.del{color:var(--muted);font-weight:500}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.hello{font-size:1.1rem;line-height:1.6;margin-top:14px}
.sec{margin-top:18px}
.sec h3{margin-bottom:4px}
.sec p{margin:.3em 0}
.plan{margin-top:10px}
.pitem{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px;background:var(--bg)}
.pitem p{margin:0 0 10px}
.pitem .row{gap:8px}
.pitem.done{border-color:var(--good)}
.st.ok{color:var(--good);font-weight:600;font-size:.92rem}
.st.no{color:var(--muted);font-weight:600;font-size:.92rem}
.lvl{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.l-hi{color:var(--good);border:1.5px solid var(--good)}
.l-md{color:var(--mid);border:1.5px solid var(--mid)}
.l-lo{color:var(--low);border:1.5px solid var(--low)}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--soft)}
.dots i.on{background:var(--ink)}
.mainmod{background:var(--ink);color:var(--bg);border:0}
.mainmod h2,.mainmod p,.mainmod .note{color:var(--bg)}
.mainmod .note{opacity:.8}
.mainmod .btn{background:var(--accent);color:#2A1D00}
.mainmod .btn.ghost{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.4)}
.step{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.mainmod .step{color:var(--bg);opacity:.75}
details.deep{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 20px}
details.deep>summary{font-family:"Young Serif",Georgia,serif;font-size:1.15rem;font-weight:400}
details.deep[open]>summary{margin-bottom:10px}
.seg{display:flex;gap:8px;margin-top:4px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:11px;font-weight:600}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt.multi .dot{border-radius:5px}
.found{list-style:none;padding:0;margin:8px 0 0}
.found li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.found li:first-child{border-top:0}
.found .mk{flex:none;font-weight:700;width:18px}
.found .mk.ok{color:var(--good)} .found .mk.no{color:var(--muted)}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
(function(){
/* =====================================================================
   CAMADA DE DADOS
   Todo acesso aos dados passa por aqui. Para migrar para o Cloudflare
   Worker (D1), troque o conteúdo de Store.load e Store.save por chamadas
   à API; o resto do app não precisa mudar.
   ===================================================================== */
const Store = {
  KEY: "perfil-aprendizagem-v3",
  load(){ try{ const v=localStorage.getItem(this.KEY); return v?JSON.parse(v):{children:[]}; }catch(e){ return {children:[]}; } },
  save(db){ try{ localStorage.setItem(this.KEY, JSON.stringify(db)); }catch(e){} }
};
let db = Store.load();
const save = ()=>Store.save(db);
const kid = id => db.children.find(c=>c.id===id);

/* ================= GÊNERO =================
   Textos usam marcadores: {ela} {Ela} {dela} {o} (terminação a/o) */
let CUR = null;
function gx(s, c){
  const m = (c||CUR||{}).sexo==="m";
  return String(s).replace(/\{ela\}/g, m?"ele":"ela").replace(/\{Ela\}/g, m?"Ele":"Ela")
    .replace(/\{dela\}/g, m?"dele":"dela").replace(/\{o\}/g, m?"o":"a");
}

/* ================= PERFIS ================= */
const STY = {
  cs:{sigla:"CS",tecnico:"Concreto-sequencial",apelido:"Prático e organizado",cor:"var(--cs)",
    resumo:"com ordem, rotina e passos claros",
    ajuda:"Saber exatamente o que se espera, instruções passo a passo, exemplos concretos, rotina previsível e poder terminar o que começou.",
    resiste:"Mudanças de última hora, instruções vagas, não saber quanto tempo a atividade vai durar e ambiente bagunçado.",
    explicar:"Mostre primeiro um exemplo pronto do resultado. Depois explique os passos na ordem e deixe praticar com o modelo por perto.",
    plano:["Uma rotina de estudos fixa, com horários previsíveis.","Checklists para tarefas longas, com etapas para ir marcando.","Blocos de atividade com começo, meio e fim bem claros."]},
  as:{sigla:"AS",tecnico:"Abstrato-sequencial",apelido:"Pensador lógico",cor:"var(--as)",
    resumo:"entendendo o porquê das coisas e tendo tempo para aprofundar",
    ajuda:"Explicações com lógica, livros e fontes para consultar, tempo para pensar e liberdade para trabalhar por conta própria.",
    resiste:"Pressa, repetição sem sentido, atividades que parecem bobas e ter de expor sentimentos na frente dos outros.",
    explicar:"Comece pelo porquê e pela lógica do assunto. Ofereça uma leitura para aprofundar e trate as perguntas como parte do aprendizado.",
    plano:["Projetos de pesquisa que durem algumas semanas.","Tempo reservado para aprofundar um tema de interesse.","Leituras de apoio além do material principal."]},
  ar:{sigla:"AR",tecnico:"Abstrato-aleatório",apelido:"Sensível e relacional",cor:"var(--ar)",
    resumo:"quando o clima é acolhedor e há alguém por perto",
    ajuda:"Estudar junto de alguém, histórias, arte e música, poder personalizar o próprio trabalho e ser reconhecid{o} pelo esforço.",
    resiste:"Frieza, críticas duras, competição e rigidez excessiva.",
    explicar:"Comece por uma história ou por uma pessoa real ligada ao assunto. Explique sentado ao lado e valorize o esforço antes de corrigir.",
    plano:["Momentos diários de estudo feitos junto.","Atividades com arte, música e histórias.","Trabalhos que a criança possa personalizar do seu jeito."]},
  cr:{sigla:"CR",tecnico:"Concreto-aleatório",apelido:"Criativo e aventureiro",cor:"var(--cr)",
    resumo:"experimentando, escolhendo e resolvendo problemas do próprio jeito",
    ajuda:"Desafios, poder escolher, projetos práticos, inventar e descobrir caminhos próprios.",
    resiste:"Rotina rígida, regras demais, ter de mostrar cada passo, atividades repetitivas e não poder escolher.",
    explicar:"Comece com um problema para resolver. Deixe tentar antes de explicar e depois organizem juntos o que foi descoberto.",
    plano:["Uma semana com escolhas: a criança decide a ordem das atividades.","Um projeto prático por semana.","Pequenos desafios, jogos ou missões no lugar de exercícios repetitivos. Se a criança gostar de tempo marcado, uma rodada cronometrada também pode funcionar."]}
};
const SKEYS = ["cs","as","ar","cr"];

/* 12 situações para a criança. Opções sem gênero de propósito. */
const P1 = [
 ["Vocês ganharam um jogo novo que ninguém conhece. O que {q} provavelmente faz primeiro?",{cs:"Lê as regras com atenção antes de começar",as:"Tenta entender a lógica e a melhor estratégia",ar:"Chama alguém para jogar junto",cr:"Começa a jogar e descobre as regras no caminho"}],
 ["Na hora de começar uma lição nova, {q}…",{cs:"pergunta exatamente o que precisa fazer e como",as:"pergunta para que serve aquilo",ar:"quer alguém por perto enquanto faz",cr:"tenta fazer do próprio jeito, antes de ouvir tudo"}],
 ["Quando a rotina do dia muda de última hora, {q}…",{cs:"se incomoda e quer saber logo o novo plano",as:"quer entender o motivo da mudança",ar:"reage conforme o clima: fica bem se ninguém estiver tenso",cr:"gosta da novidade e se adapta rápido"}],
 ["Numa tarde livre, sem nada combinado, {q} provavelmente…",{cs:"organiza, coleciona ou termina algo que começou",as:"lê, pesquisa ou fica pensando num assunto",ar:"procura alguém para conversar, brincar ou criar junto",cr:"inventa uma brincadeira, constrói ou explora algo novo"}],
 ["Quando tem uma tarefa com prazo, {q}…",{cs:"começa cedo e segue uma ordem até terminar",as:"capricha tanto nos detalhes que às vezes atrasa",ar:"rende conforme o ânimo e a companhia",cr:"deixa para depois e resolve na última hora"}],
 ["Depois de uma correção na atividade, {q} costuma…",{cs:"querer saber exatamente o que mudar",as:"questionar se a correção faz sentido",ar:"se abalar se o tom foi duro",cr:"argumentar ou procurar outro jeito de fazer"}],
 ["Ao montar algo (um brinquedo, uma receita, um projeto), {q}…",{cs:"segue as instruções na ordem",as:"entende como funciona antes de começar",ar:"prefere fazer junto com alguém",cr:"deixa as instruções de lado e vai testando"}],
 ["Numa brincadeira em grupo, {q} costuma…",{cs:"combinar as regras e cobrar que sejam seguidas",as:"pensar na estratégia ou observar antes de entrar",ar:"cuidar para que ninguém fique de fora",cr:"propor mudanças e inventar regras novas"}],
 ["Quando conta como foi o dia, {q} fala mais…",{cs:"do que fez, na ordem em que aconteceu",as:"de algo que aprendeu ou descobriu",ar:"de como as pessoas estavam e do que sentiu",cr:"da parte mais divertida ou inesperada"}],
 ["O que mais costuma tirar {q} do sério?",{cs:"Bagunça e coisas fora do lugar",as:"Explicações sem sentido",ar:"Briga, clima pesado ou ninguém dar atenção",cr:"Regras demais e ter de fazer tudo do mesmo jeito"}],
 ["Diante de um problema difícil, {q}…",{cs:"procura um exemplo parecido e segue os passos",as:"pensa em silêncio até entender",ar:"pede ajuda ou quer resolver junto",cr:"tenta vários caminhos até um dar certo"}],
 ["Se pudesse escolher como apresentar um trabalho, {q} faria…",{cs:"um cartaz ou resumo bem organizado",as:"uma pesquisa detalhada, com dados",ar:"algo com desenho, história ou teatro",cr:"uma maquete, um vídeo ou algo inventado"}]
];
/* 8 situações para a mãe ou o pai: [pergunta, índice das opções em P1] */
const PM = [
 ["Vocês ganharam um jogo novo que ninguém conhece. O que você provavelmente faz primeiro?",0],
 ["Quando precisa aprender algo novo, no trabalho ou em casa, você…",1],
 ["Quando a rotina do dia muda de última hora, você…",2],
 ["Numa tarde livre, sem nada combinado, você provavelmente…",3],
 ["Quando tem uma tarefa com prazo, você…",4],
 ["Quando alguém critica algo que você fez, você costuma…",5],
 ["Ao montar algo (um móvel, uma receita, um projeto), você…",6],
 ["O que mais costuma tirar você do sério?",9]
];
const P4 = [
 ["som","Para estudar, {q} rende mais com…",["Silêncio","Música ou som de fundo","Tanto faz"]],
 ["hora","Em que período {q} costuma render mais?",["De manhã","À tarde","À noite"]],
 ["mov","Durante as atividades, {q}…",["Precisa de pausas curtas e frequentes","Consegue ficar bastante tempo concentrad{o}","Varia"]],
 ["comp","{Q} costuma render mais…",["Sozinh{o}","Com um adulto por perto","Com outras crianças"]]
];
const ENV_LBL = {som:"Som",hora:"Período",mov:"Movimento",comp:"Companhia"};
const envTxt = (r,k) => r.env[k]==null ? "–" : P4.find(p=>p[0]===k)[2][r.env[k]];
const P3 = [
 ["Para memorizar algo, {q}…",{au:"repete em voz alta ou canta",vi:"imagina, desenha ou escreve",ci:"precisa fazer, montar ou se mexer"}],
 ["Aprendendo algo novo, {q} prefere…",{au:"ouvir alguém explicar",vi:"ver uma demonstração ou figura",ci:"pôr a mão na massa"}],
 ["O que mais distrai {q}?",{au:"Barulho e conversas",vi:"Bagunça ou movimento à vista",ci:"Ficar parad{o} muito tempo"}],
 ["O passatempo preferido de {q} envolve…",{au:"música, histórias ou conversa",vi:"desenho, vídeos ou quebra-cabeça",ci:"esporte, construção ou dança"}]
];
const P2 = [
 ["Ao receber uma explicação, {q}…",{a:"prefere os detalhes em ordem, um por um",g:"quer primeiro a ideia geral e para que serve"}],
 ["Com várias tarefas, {q}…",{a:"faz uma de cada vez, até terminar",g:"alterna entre elas e faz várias ao mesmo tempo"}],
 ["Quando recebe uma crítica, {q}…",{a:"encara como informação sobre a tarefa",g:"costuma levar para o lado pessoal"}],
 ["Com o tempo, {q}…",{a:"tem boa noção de horário e prazos",g:"perde a noção do tempo quando está envolvid{o}"}]
];
const MI = {
 ling:{nome:"Palavras",item:"Gosta de ler, contar histórias e brincar com palavras",dicas:"diário, contar com as próprias palavras o que aprendeu, jogos de palavras e escrita criativa"},
 log:{nome:"Números e lógica",item:"Gosta de números, padrões, quebra-cabeças e de entender causas",dicas:"problemas e desafios, experimentos, classificar, comparar e descobrir padrões"},
 esp:{nome:"Imagens e espaço",item:"Desenha, monta coisas e se orienta bem em lugares",dicas:"mapas, desenhos, esquemas, maquetes e construção"},
 mus:{nome:"Música e ritmo",item:"Percebe ritmos, cantarola e guarda músicas com facilidade",dicas:"músicas e ritmos para memorizar tabuada, listas e datas"},
 cor:{nome:"Corpo e movimento",item:"Aprende com o corpo: esporte, dança, trabalhos manuais, teatro",dicas:"dramatizar, manipular materiais, aprender em movimento e projetos práticos"},
 inter:{nome:"Pessoas",item:"Entende bem as pessoas e gosta de fazer as coisas em grupo",dicas:"estudar em dupla, ensinar o conteúdo para alguém, projetos em grupo"},
 intra:{nome:"Autoconhecimento",item:"Gosta de refletir e conhece bem os próprios sentimentos",dicas:"metas pessoais, diário de reflexão, poder escolher temas e ritmo"}
};
const MKEYS = ["ling","log","esp","mus","cor","inter","intra"];
const CH = {au:"Ouvir e conversar",vi:"Ver, desenhar e observar",ci:"Fazer e se movimentar"};
const CH_FRASE = {au:"ouvir, falar e conversar",vi:"ver, desenhar e observar",ci:"atividades práticas e de movimento"};
const CH_TIPS = {
  au:"Experimente explicar em voz alta, pedir que {ela} explique de volta e usar rimas e músicas para memorizar.",
  vi:"Experimente mapas mentais, desenhos, cores e mostrar uma figura ou demonstração antes de explicar.",
  ci:"Experimente incluir material concreto, movimento e experimentos, e pausas curtas entre as atividades."

/* Leitura do perfil com tratamento de empate.
   tipo: "claro" (um perfil), "equilibrado" (dois muito próximos), "indefinido" (sem tendência). */
function perfil(styles){
  const o = SKEYS.slice().sort((a,b)=>styles[b]-styles[a]);
  const v = o.map(k=>styles[k]);
  if(v[0]-v[2] <= 1) return {tipo:"indefinido", main:[o[0],o[1]], o};
  if(v[0]-v[1] <= 1) return {tipo:"equilibrado", main:[o[0],o[1]], o};
  return {tipo:"claro", main:[o[0]], o};
}

/* ================= QUESTIONÁRIO ================= */
function buildSteps(mod){
  const s = [];
  if(mod==="forcas"){
    FQ.forEach((q,i)=>s.push({part:HAB,lead:"Pensando em {n} nas últimas semanas:",kind:"f",i,stem:q[1],opts:LIK.map((t,j)=>[String(j+1),t])}));
    return s;
  }
  const pm = "Escolha a que mais combina, mesmo que outras também combinem um pouco.";
  if(mod==="mae"){
    PM.forEach((p,i)=>s.push({part:"Sobre você",lead:pm,kind:"p1",i,stem:p[0],opts:shuffle(SKEYS.map(k=>[k,P1[p[1]][1][k]]),i+7)}));
    return s;
  }
  P1.forEach((p,i)=>s.push({part:"Jeito de pensar",lead:pm,kind:"p1",i,stem:p[0],opts:shuffle(SKEYS.map(k=>[k,p[1][k]]),i+3)}));
  P4.forEach((p,i)=>s.push({part:"Concentração",lead:"",kind:"p4",i,key:p[0],stem:p[1],opts:p[2].map((t,j)=>[String(j),t])}));
  P3.forEach((p,i)=>s.push({part:"Memória",lead:"Escolha a que mais combina.",kind:"p3",i,stem:p[0],opts:shuffle(["au","vi","ci"].map(k=>[k,p[1][k]]),i+5)}));
  P2.forEach((p,i)=>s.push({part:"Compreensão",lead:"Escolha a que mais combina.",kind:"p2",i,stem:p[0],opts:shuffle([["a",p[1].a],["g",p[1].g]],i+1)}));
  s.push({part:"Interesses e facilidades",lead:"Marque tudo o que costuma aparecer. Pode ser mais de uma opção, ou nenhuma.",kind:"mi",multi:true,stem:"O que combina com {q}?",opts:MKEYS.map(k=>[k,MI[k].item])});
  return s;
}

function quiz(id, mod){
  const c = kid(id); CUR = c;
  const steps = buildSteps(mod), ans = new Array(steps.length);
  let idx = 0;
  const who = mod==="mae" ? "você" : c.nome, Who = mod==="mae" ? "Você" : c.nome;
  const fill = t => gx(t.replace("{Q}",Who).replace("{q}",who).replace("{n}",c.nome), c);
  go(`
  <button class="back" id="bk">‹ Sair sem salvar</button>
  <div class="part" id="qp"></div>
  <div class="progress"><i id="qb"></i></div>
  <div class="note" id="qc"></div>
  <p class="note" id="ql" style="margin-top:14px"></p>
  <h2 class="qtext" id="qt" aria-live="polite"></h2>
  <div class="opts" id="qo" role="group"></div>
  <div class="qnav"><button class="btn ghost small" id="qback">Voltar</button><button class="btn small hidden" id="qfin">Ver resultado</button></div>`);
  function render(){
    const st = steps[idx], last = idx===steps.length-1;
    $("qp").textContent = st.part;
    $("qb").style.width = (idx/steps.length*100)+"%";
    $("qc").textContent = `${idx+1} de ${steps.length}`;
    $("ql").textContent = fill(st.lead);
    $("qt").textContent = fill(st.stem);
    if(st.multi){
      const sel = ans[idx] || [];
      $("qo").innerHTML = st.opts.map(([k,t])=>`<button class="opt multi" data-k="${k}" aria-pressed="${sel.includes(k)}"><span class="dot"></span>${esc(fill(t))}</button>`).join("");
    } else {
      $("qo").innerHTML = st.opts.map(([k,t])=>`<button class="opt" data-k="${k}" aria-pressed="${ans[idx]===k}"><span class="dot"></span>${esc(fill(t))}</button>`).join("");
    }
    $("qback").style.visibility = idx===0?"hidden":"visible";
    $("qfin").classList.toggle("hidden", !(last && (st.multi || ans[idx])));
  }
  $("qo").onclick = e=>{
    const b = e.target.closest(".opt"); if(!b) return;
    const st = steps[idx];
    if(st.multi){ const sel = ans[idx] || []; const k=b.dataset.k; ans[idx] = sel.includes(k) ? sel.filter(x=>x!==k) : sel.concat(k); render(); return; }
    ans[idx] = b.dataset.k; render();
    if(idx<steps.length-1) setTimeout(()=>{ idx++; render(); },220);
  };
  $("qback").onclick = ()=>{ if(idx>0){ idx--; render(); } };
  $("bk").onclick = ()=>{ if(!ans.some(Boolean) || confirm("Sair sem salvar as respostas?")) hub(id); };
  $("qfin").onclick = ()=>{
    if(mod==="forcas"){
      const sum={}, cnt={};
      FQ.forEach((q,i)=>{ let v=+ans[i]; if(q[2]) v=6-v; sum[q[0]]=(sum[q[0]]||0)+v; cnt[q[0]]=(cnt[q[0]]||0)+1; });
      const avg={}; TORD.forEach(k=>avg[k]=Math.round(sum[k]/cnt[k]*100)/100);
      c.forcas.push({data:Date.now(),avg}); save(); resForcas(id); return;
    }
    const r = {styles:{cs:0,as:0,ar:0,cr:0}, ga:{a:0,g:0}, ch:{au:0,vi:0,ci:0}, env:{}, mi:{}};
    steps.forEach((st,i)=>{ const k=ans[i];
      if(st.kind==="p1") r.styles[k]++;
      else if(st.kind==="p2") r.ga[k]++;
      else if(st.kind==="p3") r.ch[k]++;
      else if(st.kind==="p4") r.env[st.key]=+k;
      else if(st.kind==="mi") MKEYS.forEach(m=>r.mi[m]=(k||[]).includes(m)?1:0); });
    if(mod==="mae"){ c.parent = r.styles; save(); resMae(id); return; }
    c.estilo = {data:Date.now(), res:r};
    arquivarPlano(c);
    c.plano = newPlan(c);
    save(); resEstilo(id);
  };
  render();
}

/* ================= PLANO E HISTÓRICO ================= */
// Guarda no histórico as ideias do plano atual que a mãe já marcou.
function arquivarPlano(c){
  if(!c.plano) return;
  c.historico = c.historico || [];
  c.plano.items.filter(i=>i.status==="sim"||i.status==="nao").forEach(i=>{
    c.historico = c.historico.filter(h=>h.txt!==i.txt);
    c.historico.push({txt:i.txt, status:i.status, data:i.data||Date.now()});
  });
}
// Tudo o que já foi testado: histórico + plano atual.
function descobertas(c){
  const m = new Map();
  (c.historico||[]).forEach(h=>m.set(h.txt,h));
  if(c.plano) c.plano.items.filter(i=>i.status==="sim"||i.status==="nao").forEach(i=>m.set(i.txt,{txt:i.txt,status:i.status,data:i.data}));
  return [...m.values()].sort((a,b)=>b.data-a.data);
}
function pool(c){
  const r = c.estilo.res, p = perfil(r.styles);
  const lists = [...p.main.map(k=>EXP_STY[k]), ...topChans(r.ch).map(k=>EXP_CH[k]), EXP_GA[gaKind(r.ga)], expEnv(r.env)];
  const f = lastF(c);
  if(f) lists.push(TORD.filter(k=>isObs(f.avg[k])).map(k=>TRAITS[k].dicas[0]));
  const testadas = new Set(descobertas(c).map(d=>d.txt));
  const out = [], max = Math.max(...lists.map(l=>l.length));
  for(let i=0;i<max;i++) lists.forEach(l=>{ if(l[i] && !out.includes(l[i]) && !testadas.has(l[i])) out.push(l[i]); });
  return out;
}
function newPlan(c, excl){
  let p = pool(c).filter(t=>!excl || !excl.has(t));
  if(!p.length) p = pool(c);
  return {data:Date.now(), items:p.slice(0,3).map(t=>({txt:t,status:null}))};
}

function integ(id){
  const c=kid(id); CUR=c;
  const av=lastF(c).avg, r=c.estilo.res, nome=esc(c.nome), p=perfil(r.styles);
  const has = k => p.main.includes(k);
  const gk=gaKind(r.ga), tch=topChans(r.ch);
  const tl = k=>TRAITS[k].nome;
  const RULES = [
    {t:"det",s:"cr",c:()=>has("cr"),txt:"Se você percebe dificuldade em manter tarefas longas, uma hipótese para experimentar é que o formato não esteja combinando com o perfil criativo e aventureiro. Tente transformar a tarefa em um pequeno desafio ou missão e deixar a criança escolher o caminho."},
    {t:"det",s:"ar",c:()=>has("ar"),txt:"Se você percebe que {ela} desiste quando está sozinh{o}, experimente estudar ao lado e reconhecer o esforço em voz alta. Para o perfil sensível e relacional, companhia costuma sustentar a persistência."},
    {t:"det",s:"as",c:()=>has("as"),txt:"Se você percebe que {ela} larga atividades no meio, uma hipótese é que a tarefa não pareça fazer sentido. Experimente explicar para que serve e oferecer um projeto longo num tema de que {ela} goste."},
    {t:"det",s:"cs",c:()=>has("cs"),txt:"Se você percebe que {ela} trava diante de tarefas grandes, experimente dividi-las em etapas com checklist. Ver o progresso marcado costuma ajudar o perfil prático e organizado a persistir."},
    {t:"aut",s:null,c:()=>tch.includes("ci")||r.env.mov===0,txt:"Se você percebe dificuldade em ficar parad{o} e focad{o}, uma hipótese é necessidade de movimento. Experimente pausas ativas curtas e deixar estudar em pé ou manuseando algo."},
    {t:"aut",s:null,c:()=>gk==="g",txt:"Se você percebe que {ela} pula de uma atividade para outra, experimente blocos curtos, uma tarefa por vez à vista na mesa e um combinado claro de quando pode trocar."},
    {t:"aut",s:"cr",c:()=>has("cr"),txt:"Se você percebe resistência às regras, experimente construir os combinados junto com a criança e oferecer escolhas dentro de limites claros."},
    {t:"oti",s:"ar",c:()=>has("ar")||gk==="g",txt:"Se você percebe desânimo depois de correções, uma hipótese é que o tom esteja pesando. Experimente começar pelo que ficou bom e corrigir o trabalho, não a pessoa."},
    {t:"oti",s:null,c:()=>has("as")||has("cs"),txt:"Se você percebe frustração com erros, uma hipótese é a vontade de acertar de primeira. Experimente revisar os erros juntos como informação: onde errou, por quê e o que muda na próxima."},
    {t:"ent",s:null,c:()=>has("cr")||has("ar"),txt:"Se você percebe pouca animação nas atividades, experimente dar mais escolhas, incluir projetos práticos e fazer algumas atividades junto."},
    {t:"ent",s:null,c:()=>has("cs")||has("as"),txt:"Se você percebe pouca animação, experimente metas claras e a chance de aprofundar num tema preferido. O interesse costuma crescer quando a criança sente que domina o assunto."},
    {t:"cur",s:"cs",c:()=>has("cs"),txt:"Se você percebe pouco interesse em investigar, experimente dar estrutura à curiosidade: uma pergunta por semana, com passos para pesquisar e um jeito concreto de mostrar o que descobriu."},
    {t:"cur",s:null,c:()=>gk==="a",txt:"Se você percebe que {ela} se prende às tarefas e explora pouco, experimente reservar um tempo livre, sem nota nem correção, só para investigar um assunto de interesse."},
    {t:"soc",s:null,c:()=>has("as")||r.env.comp===0,txt:"Se você percebe pouca vontade de trabalhar em grupo, lembre que preferir estudar por conta própria é legítimo. Experimente tarefas em dupla com papéis bem definidos."},

  ];
  const obs = TORD.filter(k=>isObs(av[k]));

  const topF = TORD.slice().sort((a,b)=>av[b]-av[a])[0];
  const marcados = MKEYS.filter(k=>r.mi[k]);
  const s1 = p.main[0];
  go(`
  <button class="back" id="bk">‹ ${nome}</button>
  <h1>Visão integrada de ${nome}</h1>
  <p class="note">Jeito de aprender de ${fmt(c.estilo.data)} e habilidades de ${fmt(lastF(c).data)}</p>
  <div class="snap">
    <div><small>Perfil</small><b>${nomePerfil(p)}</b></div>
    <div><small>Habilidade que mais aparece</small><b>${tl(topF)}</b></div>
    <div><small>O que mais envolve</small><b>${tch.map(k=>CH[k]).join(" / ")}</b></div>
    <div><small>Vale observar</small><b>${obs.length?obs.map(tl).join(", "):"Nada em destaque"}</b></div>
  </div>
  <h2 style="margin-top:28px">Hipóteses para experimentar</h2>
  <p class="note">Cruzamentos entre o que vale observar e o jeito de aprender. Não são conclusões: são ideias para testar e ver o que funciona.</p>
  ${hits.length ? hits.map(h=>`<div class="cross"><div class="tag"><span>${tl(h.t)}</span>${h.s?`<span>${STY[h.s].apelido}</span>`:""}</div><p>${h.txt}</p></div>`).join("")
    : obs.length ? `<div class="cross"><p>Não encontramos um cruzamento claro com o perfil de ${nome}. Use as ideias de cada habilidade no resultado, apresentando-as do jeito que costuma funcionar: ${low1(STY[s1].explicar)}</p></div>`
    : `<div class="cross"><p>Nenhuma habilidade ficou em "vale observar". O melhor caminho agora é continuar oferecendo o que já funciona e usar os pontos de apoio abaixo para novos desafios.</p></div>`}
  <h2 style="margin-top:28px">Pontos de apoio</h2>
  <div class="cross"><p><b>${tl(topF)}</b> foi a habilidade que mais apareceu. Lembre ${nome} disso quando surgir um desafio: {ela} já sabe fazer algo parecido.</p>
  ${marcados.length?`<p>O interesse por <b>${MI[marcados[0]].nome.toLowerCase()}</b> pode ser porta de entrada para os conteúdos mais difíceis: ${MI[marcados[0]].dicas}.</p>`:""}
  <p>Pelo perfil ${STY[s1].apelido.toLowerCase()}: ${low1(STY[s1].explicar)}</p></div>
  <div class="panel"><h3>Um passo de cada vez</h3><p>No plano da semana, o botão "Quero outras ideias" passa a incluir também sugestões das habilidades. Escolha poucas mudanças por vez e observe o que acontece.</p>
  <div class="row"><button class="btn small" id="pl">Abrir plano da semana</button></div></div>`);
  $("bk").onclick=()=>hub(id);
  $("pl").onclick=()=>planScreen(id);
}

home();
})();
</script>
</body>
</html>
